name: Security Audit

# Weekly + on-push dependency/secret/DAST checks. Jobs that need a live site
# skip cleanly when vars.SITE_URL is unset, so a fresh fork stays green.
# Set CI_RUNNER_LABELS (e.g. '["self-hosted","zimacube"]') to use your own
# runners; defaults to GitHub-hosted ubuntu-latest.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 8 * * 1" # weekly, Monday 08:23 UTC
  workflow_dispatch:

jobs:
  gitleaks:
    name: Gitleaks — Secret Scan
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan committed history
        run: |
          tool_dir="$(mktemp -d)"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            | tar -xz -C "$tool_dir" gitleaks
          "$tool_dir/gitleaks" git . --redact --no-banner
          rm -rf "$tool_dir"

  npm-audit:
    name: npm audit — Dependency Vulnerabilities
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Upload audit report on failure
        if: failure()
        run: npm audit --json > npm-audit-report.json || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: npm-audit-report
          path: npm-audit-report.json

  zap-baseline:
    name: ZAP — Baseline DAST
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '"ubuntu-latest"') }}
    needs: [npm-audit]
    if: vars.SITE_URL != ''
    steps:
      - uses: actions/checkout@v7
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ vars.SITE_URL }}
          fail_action: false
          allow_issue_writing: true
          issue_title: "ZAP Security Scan Findings"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
