name: Recurring Site Issues

on:
  schedule:
    - cron: "23 7 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  create:
    if: github.event.repository.is_template != true && github.repository != 'Jesse-Garcia99/Headless-Site-Template'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: File due maintenance issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/create-recurring-issues.mjs
