name: Accessibility Tagging

# Fails when public markup loses the tagging assistive tech needs: skip links,
# landmarks, accessible names on links/buttons/controls, alt attributes,
# labelled navs, iframe titles, heading order. Static audit over the built
# site — see scripts/audit-a11y.mjs for the rule list.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # worker-configuration.d.ts is gitignored; the build type-checks the
      # Worker (Fetcher etc.), so generate it first.
      - name: Generate Cloudflare Worker types
        run: npx wrangler types

      - name: Build Tina (local content) + Next.js
        run: npm run build:local

      - name: Audit accessibility tagging
        run: npm run audit:a11y
