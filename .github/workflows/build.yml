name: Build Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # worker-configuration.d.ts is gitignored; the build type-checks the
      # Worker (Fetcher etc.), so generate it first.
      - name: Generate Cloudflare Worker types
        run: npx wrangler types

      # Verification builds against the repo's own content, so CI needs no
      # Tina Cloud credentials. The deploy build still uses `npm run build`.
      - name: Build Tina (local content) + Next.js and type-check it
        run: |
          npm run build:local
          npm run lint

      - name: Verify SEO and accessibility baseline
        run: npm run audit:seo

      - name: Verify accessibility tagging
        run: npm run audit:a11y

      - name: Verify responsive breakpoints
        run: npm run audit:responsive

      - name: Verify agent discovery baseline
        run: npm run audit:discovery

      - name: Verify Cloudflare Worker bundle
        run: npm run worker:check
