name: Agent readiness change
description: Track crawler, Markdown, structured-discovery, or agent-facing delivery work.
title: "[agent-readiness] "
labels: [agent-readiness]
body:
  - type: textarea
    id: capability
    attributes:
      label: Real capability being exposed
      description: Name the deployed page, API, agent, skill, MCP server, or browser action. Do not advertise placeholders.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Production evidence
      description: Include the deployed URLs and expected response types.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Completion checks
      options:
        - label: robots.txt AI crawler groups, Content-Signal, sitemap.xml, and Markdown negotiation remain correct.
        - label: Link headers and every enabled discovery document (api-catalog, auth.md, A2A, skills, MCP, OAuth, commerce) point only to live capabilities.
        - label: npm run audit:discovery and POST https://isitagentready.com/api/scan pass for the checks this change enables.
